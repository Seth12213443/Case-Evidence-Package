<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Loader</title>
    <style>
        :root {
            --bg-dark: #0a0a12;
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-width: 220px;
            --card-height: 320px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a12 100%),
                linear-gradient(0deg, rgba(0,0,0,0.2) 0%, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.2) 0%, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            color: white;
        }

        /* --- Header --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            text-align: center;
            z-index: 1000;
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.7rem;
            opacity: 0.6;
            letter-spacing: 2px;
        }

        /* --- 3D Carousel --- */
        .scene {
            width: var(--card-width);
            height: var(--card-height);
            perspective: 1000px;
            margin-top: 150px;
            margin-bottom: 50px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .carousel {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card {
            position: absolute;
            width: var(--card-width);
            height: var(--card-height);
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            user-select: none;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary);
            box-shadow: 0 0 25px var(--primary), inset 0 0 10px rgba(0, 243, 255, 0.2);
            transform: scale(1.05) !important;
        }

        .card-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px var(--primary));
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            padding: 0 10px;
        }

        .card-meta {
            font-size: 0.75rem;
            color: var(--primary);
            margin-top: 8px;
            opacity: 0.8;
        }

        /* --- Controls --- */
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            z-index: 1000;
        }

        button.nav-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button.nav-btn:hover {
            background: var(--primary);
            color: black;
            box-shadow: 0 0 15px var(--primary);
        }

        /* Loader Overlay */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 18, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #loader.visible {
            opacity: 1;
            pointer-events: all;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--glass-border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Back Button inside content */
        .back-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--secondary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px var(--secondary);
            z-index: 1500;
            display: none;
            transition: transform 0.2s;
        }

        .back-btn:hover {
            transform: scale(1.1);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    </style>
</head>
<body>

    <header id="main-header">
        <h1>Evidence Loader</h1>
        <div class="subtitle">Select Source File to Preview</div>
    </header>

    <!-- 3D Menu -->
    <div id="menu-container">
        <div class="scene" id="menuScene">
            <div class="carousel" id="carousel"></div>
        </div>

        <!-- Controls -->
        <div class="controls" id="navControls">
            <button class="nav-btn" onclick="rotate(-1)">◀ PREV</button>
            <button class="nav-btn" onclick="rotate(1)">NEXT ▶</button>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const SOURCE_FILES = [
            {
                id: 'source-html',
                title: 'Case Package',
                meta: 'Main Case Form Structure',
                icon: '📄',
                url: 'https://raw.githubusercontent.com/Seth12213443/Case-Evidence-Package/refs/heads/main/casepackage.html'
            }
        ];

        // ==========================================
        // LOGIC
        // ==========================================
        const carousel = document.getElementById('carousel');
        const menuContainer = document.getElementById('menu-container');
        const navControls = document.getElementById('navControls');
        const loader = document.getElementById('loader');
        
        let currentIndex = 0;
        const totalCards = SOURCE_FILES.length;
        const cardAngle = 360 / totalCards;
        const radius = Math.round((totalCards / 2) / Math.tan(Math.PI / totalCards)) + 150; 

        function initCarousel() {
            SOURCE_FILES.forEach((file, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;
                
                const rotateY = index * cardAngle;
                const translateZ = radius; 
                
                card.style.transform = `rotateY(${rotateY}deg) translateZ(${translateZ}px)`;
                
                card.innerHTML = `
                    <div class="card-icon">${file.icon}</div>
                    <div class="card-title">${file.title}</div>
                    <div class="card-meta">${file.meta}</div>
                `;

                card.addEventListener('click', () => {
                    loadFile(SOURCE_FILES[index]);
                });

                carousel.appendChild(card);
            });
            
            updateCarousel();
            selectCard(0); 
        }

        function updateCarousel() {
            const rotateY = -(currentIndex * cardAngle);
            carousel.style.transform = `rotateY(${rotateY}deg)`;
        }

        function rotate(direction) {
            currentIndex += direction;
            if (currentIndex >= totalCards) currentIndex = 0;
            if (currentIndex < 0) currentIndex = totalCards - 1;
            updateCarousel();
        }

        function selectCard(index) {
            currentIndex = index;
            updateCarousel();
        }

        async function loadFile(fileObj) {
            showLoader(true);
            
            try {
                const response = await fetch(fileObj.url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const htmlContent = await response.text();
                
                // Hide Menu Completely
                menuContainer.style.display = 'none';
                document.getElementById('main-header').style.display = 'none';
                
                // Clear Body completely
                document.body.innerHTML = '';
                
                // Create an iframe to isolate the content
                const iframe = document.createElement('iframe');
                iframe.srcdoc = htmlContent;
                iframe.style.width = '100%';
                iframe.style.height = '100vh';
                iframe.style.border = 'none';
                iframe.style.background = '#fff'; // Default background for raw files
                
                document.body.appendChild(iframe);

                // Add a "Back" button dynamically inside the content
                const btn = document.createElement('button');
                btn.className = 'sys-back-btn back-btn';
                btn.innerText = '🔙 Return to Menu';
                btn.onclick = returnToMenu;
                iframe.contentWindow.document.body.appendChild(btn);

                // Show the back button after a slight delay
                setTimeout(() => {
                    document.querySelector('.back-btn').style.display = 'block';
                }, 100);

            } catch (error) {
                console.error("Error loading file:", error);
                alert("Failed to load file. Check console.");
                returnToMenu();
            } finally {
                showLoader(false);
            }
        }

        function returnToMenu() {
            // Rebuild the entire DOM structure
            location.reload(); 
        }

        function showLoader(show) {
            if (show) {
                loader.classList.add('visible');
            } else {
                loader.classList.remove('visible');
            }
        }

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (menuContainer.style.display === 'none') return; // Disable nav when in content
            if (e.key === 'ArrowLeft') rotate(-1);
            if (e.key === 'ArrowRight') rotate(1);
        });

        // Start
        initCarousel();

    </script>
</body>
</html>
